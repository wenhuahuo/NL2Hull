[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nurbs-ship-reconstruction"
version = "0.1.0"
description = "Reproduce the paper's vertical NURBS parameterization on classic hull STL meshes"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "trimesh>=4.0",
]

[project.scripts]
reconstruct-classic-hulls = "nurbs_ship_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
